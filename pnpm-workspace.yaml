packages:
  - "apps/*"
  - "packages/*"
  
catalogMode: manual 
catalog:
  typescript: ^7.0.2
  react: ^19.2.8
  react-dom: ^19.2.8
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.7
  "@types/node": ^24.13.3
  "@vitejs/plugin-react": ^6.1.1
  vite: ^8.3.0
  tailwindcss: ^4.3.0
  "@tailwindcss/vite": ^4.3.0
  cn: ^0.4.0
  lucide-react: ^1.56.0
  "@base-ui/react": ^1.9.0
  class-variance-authority: ^0.7.1
  
engineStrict: true
minimumReleaseAge: 1440
allowBuilds:
  '@azure/msal-node-extensions': false
  '@microsoft/m365agentstoolkit-cli': false
  keytar: false
permissions:
  '@tanstack/router-plugin':
    skills: true

skills:
  dirs:
    - .claude/skills
